<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <!-- Símbolo da Confraria Vinhófilos: 8 taças em roda, cada uma com uma cor do logo -->
  <defs>
    <g id="taca">
      <path d="M0 -3 V-23" stroke="#3b3b3d" stroke-width="3.2" stroke-linecap="round" fill="none"/>
      <path d="M-11.5 -46 C-12 -30 -6.5 -23 0 -23 C6.5 -23 12 -30 11.5 -46" stroke="#3b3b3d" stroke-width="3.6" stroke-linecap="round" fill="none"/>
    </g>
    <path id="vinho" d="M-8.4 -40 C-8 -31 -4.6 -27.2 0 -27.2 C4.4 -27.2 7.6 -30.6 8.4 -36 C4 -34 -2 -35 -8.4 -40 Z"/>
  </defs>
  <g><use href="#taca"/><use href="#vinho" fill="#c67b84"/></g>
  <g transform="rotate(45)"><use href="#taca"/><use href="#vinho" fill="#6b1fa0"/></g>
  <g transform="rotate(90)"><use href="#taca"/><use href="#vinho" fill="#c8d64f"/></g>
  <g transform="rotate(135)"><use href="#taca"/><use href="#vinho" fill="#e3dc8a"/></g>
  <g transform="rotate(180)"><use href="#taca"/><use href="#vinho" fill="#df6d70"/></g>
  <g transform="rotate(225)"><use href="#taca"/><use href="#vinho" fill="#f2c46e"/></g>
  <g transform="rotate(270)"><use href="#taca"/><use href="#vinho" fill="#a67dc0"/></g>
  <g transform="rotate(315)"><use href="#taca"/><use href="#vinho" fill="#8b3a52"/></g>
</svg>
